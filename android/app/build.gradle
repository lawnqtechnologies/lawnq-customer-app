apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

def enableProguardInReleaseBuilds = false
def jscFlavor = "org.webkit:android-jsc:+"

react {
  autolinkLibrariesWithApp()
}

android {
  namespace "com.lawnqapp"
  compileSdk rootProject.ext.compileSdkVersion
  ndkVersion rootProject.ext.ndkVersion

  defaultConfig {
    applicationId "com.lawnqapp"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 65
    versionName "3.0.3"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions { jvmTarget = "17" }

  signingConfigs {
    debug {
      storeFile file("debug.keystore")
      storePassword "android"
      keyAlias "androiddebugkey"
      keyPassword "android"
    }
    release {
      storeFile file("release-key.keystore")
      storePassword "lawnq@123"
      keyAlias "my-key-alias"
      keyPassword "lawnq@123"
    }
  }

  buildTypes {
    debug { signingConfig signingConfigs.debug }

    release {
      signingConfig signingConfigs.release
      minifyEnabled enableProguardInReleaseBuilds
    proguardFiles(
    getDefaultProguardFile("proguard-android-optimize.txt"),
    "proguard-rules.pro"
    )
    }
  }

  packagingOptions {
    resources {
      excludes += [
        "META-INF/DEPENDENCIES",
        "META-INF/LICENSE",
        "META-INF/LICENSE.txt",
        "META-INF/NOTICE",
        "META-INF/NOTICE.txt",
        "META-INF/*.kotlin_module"
      ]
    }
  }
}

dependencies {
  implementation("com.facebook.react:react-android")
  implementation("com.google.android.material:material:1.12.0")

  implementation(platform("com.google.firebase:firebase-bom:33.6.0"))
  implementation("com.google.firebase:firebase-auth")
  implementation("com.google.firebase:firebase-appcheck-playintegrity")
  implementation("com.google.android.play:integrity:1.4.0")

  // ✅ prevents Compose compiler “runtime not found” errors
  implementation("androidx.compose.runtime:runtime:1.6.8")

  if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
    implementation jscFlavor
  }
}

// Add this at the end of the file or outside the android { } block
tasks.register("testClasses") {
    // This task is a placeholder to satisfy the IDE/Gradle requirements
}

afterEvaluate {
  tasks.matching { task ->
    !task.name.toLowerCase().contains("clean") &&
      (task.name.startsWith("configureCMake") ||
        task.name.startsWith("buildCMake") ||
        task.name.startsWith("generateJsonModel"))
  }.configureEach { task ->
    task.dependsOn(
      task.name.toLowerCase().contains("debug")
        ? ":react-native-reanimated:prefabDebugPackage"
        : ":react-native-reanimated:prefabReleasePackage"
    )
  }
}
