buildscript {
  ext {
    buildToolsVersion = "35.0.0"
    minSdkVersion = 26
    compileSdkVersion = 35
    targetSdkVersion = 35
    ndkVersion = "26.1.10909125"

    kotlinVersion = "2.0.21"

    // LoaderKit
    LoaderKit_compileSdkVersion = 34
    LoaderKit_minSdkVersion = 26
    LoaderKit_targetSdkVersion = 34
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath("com.android.tools.build:gradle:8.6.1")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    classpath("com.google.gms:google-services:4.3.15")
  }
}

/**
 * ✅ Global repositories + dependency alignment
 */
allprojects {
  repositories {
    google()
    mavenCentral()
  }

  // Keep Kotlin consistent & avoid Kotlin 2.x metadata sneaking in
  configurations.configureEach {
    resolutionStrategy {
      force(
        "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${rootProject.ext.kotlinVersion}",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${rootProject.ext.kotlinVersion}",
        "org.jetbrains.kotlin:kotlin-reflect:${rootProject.ext.kotlinVersion}"
      )

      eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin") {
          details.useVersion(rootProject.ext.kotlinVersion)
        }

        // Align coroutines for Kotlin 1.9.x
        if (details.requested.group == "org.jetbrains.kotlinx" &&
            details.requested.name.startsWith("kotlinx-coroutines")) {
          details.useVersion("1.8.1")
        }
      }
    }
  }
}

/**
 * ✅ Kotlin compile settings for ALL subprojects
 * - Force JVM target 17 (AGP 8.x requirement)
 * - Suppress Compose compiler Kotlin compatibility check (Compose Compiler 1.3.2 vs Kotlin 1.9.24)
 */
subprojects {
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
      jvmTarget = "17"
      freeCompilerArgs += [
        "-P",
        "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"
      ]
    }
  }
}

/**
 * React Native root plugin
 */
apply plugin: "com.facebook.react.rootproject"
